[package]
name = "platform-win"
version.workspace = true
edition.workspace = true

[[bin]]
name = "wallp"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
core-engine = { path = "../core-engine" }
interprocess = { version = "2.4", features = ["tokio"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
widestring = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
