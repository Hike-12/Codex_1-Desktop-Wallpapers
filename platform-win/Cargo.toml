[package]
name = "platform-win"
version.workspace = true
edition.workspace = true

[target.'cfg(windows)'.dependencies]
core-engine.workspace = true
interprocess = { version = "2.4", features = ["tokio"] }
pollster = "0.4"
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tray-icon = { version = "0.26", default-features = false }
wasapi = "0.27"
widestring = "1"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
