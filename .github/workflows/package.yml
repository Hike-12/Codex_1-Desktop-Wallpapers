name: Package release

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix nasm
          bash scripts/build-ffmpeg.sh decoder windows
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-decoder
          path: decoder/*.exe
          if-no-files-found: error
          retention-days: 1
  package-windows:
    name: wallp-windows-x86_64.zip
    runs-on: windows-latest
    needs: windows-decoder
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-decoder
          path: decoder
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the Windows release binary
        shell: pwsh
        env:
          WALLP_FFMPEG_DIR: ${{ github.workspace }}/decoder
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo +stable build --locked --release --bin wallp --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wallp.exe target/release/wallp.exe
      - name: Check and archive the Windows binary
        shell: pwsh
        run: |
          $check = Start-Process -FilePath target/release/wallp.exe -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
          Compress-Archive -LiteralPath target/release/wallp.exe -DestinationPath wallp-windows-x86_64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wallp.exe
          path: target/release/wallp.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wallp-windows-x86_64.zip
          path: wallp-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
  package-unix:
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: wallp-linux-x86_64.tar.gz
          - runner: macos-15
            archive: wallp-macos-arm64.tar.gz
          - runner: macos-15-intel
            archive: wallp-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libwayland-dev libxkbcommon-dev libx11-dev pkg-config nasm
      - name: Install macOS decoder build dependencies
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm
      - name: Build the Unix decoder
        run: |
          bash scripts/build-ffmpeg.sh decoder
          test -x decoder/ffmpeg && test -x decoder/ffprobe
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the release binary
        env:
          WALLP_FFMPEG_DIR: ${{ github.workspace }}/decoder
        run: cargo +stable build --locked --release --bin wallp
      - name: Check and archive the Unix binary
        shell: bash
        run: |
          ./target/release/wallp --help
          tar -czf '${{ matrix.archive }}' -C target/release wallp
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
